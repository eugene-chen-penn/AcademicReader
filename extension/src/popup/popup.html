<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AcademicReader</title>
    <style>
      /* Design tokens shared across the extension (viewer/popup/options)
         — see viewer.html's <style> block for the canonical copy + the
         note on why each HTML document carries its own literal copy of
         this block rather than a single shared stylesheet. */
      :root {
        color-scheme: dark;

        --ar-bg: #17181c;
        --ar-bg-canvas: #26292c;
        --ar-surface: #1d1f24;
        --ar-surface-2: #232429;
        --ar-surface-3: #2b2d34;
        --ar-border: #34353c;
        --ar-border-strong: #40424c;

        --ar-text: #e6e6e9;
        --ar-text-dim: #9a9aa5;
        --ar-text-faint: #6f6f78;

        --ar-accent: #6c8cff;
        --ar-accent-hover: #85a0ff;
        --ar-accent-active: #5877e0;
        --ar-accent-contrast: #12131a;

        --ar-danger: #dc5a5a;
        --ar-danger-bg: rgba(220, 90, 90, 0.12);
        --ar-danger-border: rgba(220, 90, 90, 0.4);
        --ar-danger-text: #f2a3a3;

        --ar-success-text: #7fd9a8;
        --ar-warn-text: #d9a441;

        --ar-radius-sm: 4px;
        --ar-radius: 6px;
        --ar-radius-lg: 10px;

        --ar-space-1: 4px;
        --ar-space-2: 8px;
        --ar-space-3: 12px;
        --ar-space-4: 16px;

        --ar-font: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--ar-bg);
        color: var(--ar-text);
        font-family: var(--ar-font);
      }

      body {
        width: 320px;
        padding: var(--ar-space-4);
        box-sizing: border-box;
      }

      button:focus-visible,
      input:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--ar-accent);
        outline-offset: 2px;
      }

      h1 {
        font-size: 15px;
        margin: 0 0 var(--ar-space-3);
      }

      section {
        display: flex;
        flex-direction: column;
        gap: var(--ar-space-2);
        margin-bottom: var(--ar-space-4);
      }

      .label {
        font-size: 12px;
        font-weight: 600;
        color: #d0d0d8;
      }

      .current-url {
        font-size: 12px;
        color: var(--ar-text-dim);
        word-break: break-all;
        background: var(--ar-surface);
        border-radius: var(--ar-radius);
        padding: var(--ar-space-2) 10px;
        max-height: 60px;
        overflow-y: auto;
      }

      input[type="text"] {
        background: var(--ar-surface-2);
        border: 1px solid var(--ar-border);
        border-radius: var(--ar-radius);
        color: var(--ar-text);
        font-size: 13px;
        padding: var(--ar-space-2) 10px;
        font-family: inherit;
        transition: border-color 0.12s ease;
      }

      input[type="text"]:focus {
        outline: none;
        border-color: var(--ar-accent);
      }

      button {
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        border-radius: var(--ar-radius);
        padding: 9px 14px;
        border: 1px solid transparent;
        cursor: pointer;
        transition:
          background-color 0.12s ease,
          border-color 0.12s ease;
      }

      button.primary {
        background: var(--ar-accent);
        color: var(--ar-accent-contrast);
      }

      button.primary:hover:not(:disabled) {
        background: var(--ar-accent-hover);
      }

      button.primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      button.secondary {
        background: transparent;
        border-color: var(--ar-border-strong);
        color: var(--ar-text);
      }

      button.secondary:hover:not(:disabled) {
        border-color: var(--ar-accent);
      }

      button.secondary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      hr {
        border: none;
        border-top: 1px solid var(--ar-border);
        margin: var(--ar-space-1) 0 var(--ar-space-4);
      }

      .status {
        font-size: 12px;
        padding: var(--ar-space-2) 10px;
        border-radius: var(--ar-radius);
        display: none;
        line-height: 1.4;
      }

      .status.visible {
        display: block;
      }

      .status.ok {
        background: rgba(70, 180, 120, 0.12);
        border: 1px solid rgba(70, 180, 120, 0.4);
        color: var(--ar-success-text);
      }

      .status.error {
        background: var(--ar-danger-bg);
        border: 1px solid var(--ar-danger-border);
        color: var(--ar-danger-text);
      }

      .status.info {
        background: rgba(108, 140, 255, 0.1);
        border: 1px solid rgba(108, 140, 255, 0.35);
        color: #aebeff;
      }

      .footer {
        font-size: 11px;
        color: var(--ar-text-faint);
        text-align: center;
      }

      .footer a {
        color: #9aa9ff;
        cursor: pointer;
        text-decoration: none;
      }

      .footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>AcademicReader</h1>

    <section>
      <div class="label">This page isn't a recognized academic site</div>
      <div class="current-url" id="current-url">Loading…</div>
      <button type="button" class="primary" id="open-current-button">
        Read this page as a PDF
      </button>
    </section>

    <hr />

    <section>
      <div class="label">Or open a PDF from any URL</div>
      <input
        type="text"
        id="url-input"
        placeholder="https://example.com/paper.pdf"
        autocomplete="off"
      />
      <button type="button" class="secondary" id="open-url-button">
        Open this URL
      </button>
    </section>

    <div class="status" id="status"></div>

    <div class="footer"><a id="open-options">Settings</a></div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
