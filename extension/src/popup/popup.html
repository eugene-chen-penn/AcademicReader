<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AcademicReader</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: #17181c;
        color: #e6e6e9;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }

      body {
        width: 320px;
        padding: 16px;
        box-sizing: border-box;
      }

      h1 {
        font-size: 15px;
        margin: 0 0 12px;
      }

      section {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 16px;
      }

      .label {
        font-size: 12px;
        font-weight: 600;
        color: #d0d0d8;
      }

      .current-url {
        font-size: 12px;
        color: #9a9aa5;
        word-break: break-all;
        background: #202225;
        border-radius: 6px;
        padding: 8px 10px;
        max-height: 60px;
        overflow-y: auto;
      }

      input[type="text"] {
        background: #232429;
        border: 1px solid #34353c;
        border-radius: 6px;
        color: #e6e6e9;
        font-size: 13px;
        padding: 8px 10px;
        font-family: inherit;
      }

      input[type="text"]:focus {
        outline: none;
        border-color: #6c8cff;
      }

      button {
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        border-radius: 6px;
        padding: 9px 14px;
        border: 1px solid transparent;
        cursor: pointer;
      }

      button.primary {
        background: #6c8cff;
        color: #12131a;
      }

      button.primary:hover {
        background: #85a0ff;
      }

      button.primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      button.secondary {
        background: transparent;
        border-color: #3c3d45;
        color: #e6e6e9;
      }

      button.secondary:hover {
        border-color: #6c8cff;
      }

      hr {
        border: none;
        border-top: 1px solid #2a2b31;
        margin: 4px 0 16px;
      }

      .status {
        font-size: 12px;
        padding: 8px 10px;
        border-radius: 6px;
        display: none;
        line-height: 1.4;
      }

      .status.visible {
        display: block;
      }

      .status.ok {
        background: rgba(70, 180, 120, 0.12);
        border: 1px solid rgba(70, 180, 120, 0.4);
        color: #7fd9a8;
      }

      .status.error {
        background: rgba(220, 90, 90, 0.12);
        border: 1px solid rgba(220, 90, 90, 0.4);
        color: #f2a3a3;
      }

      .status.info {
        background: rgba(108, 140, 255, 0.1);
        border: 1px solid rgba(108, 140, 255, 0.35);
        color: #aebeff;
      }

      .footer {
        font-size: 11px;
        color: #6f6f78;
        text-align: center;
      }

      .footer a {
        color: #9aa9ff;
        cursor: pointer;
        text-decoration: none;
      }

      .footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>AcademicReader</h1>

    <section>
      <div class="label">This page isn't a recognized academic site</div>
      <div class="current-url" id="current-url">Loading…</div>
      <button type="button" class="primary" id="open-current-button">
        Read this page as a PDF
      </button>
    </section>

    <hr />

    <section>
      <div class="label">Or open a PDF from any URL</div>
      <input
        type="text"
        id="url-input"
        placeholder="https://example.com/paper.pdf"
        autocomplete="off"
      />
      <button type="button" class="secondary" id="open-url-button">
        Open this URL
      </button>
    </section>

    <div class="status" id="status"></div>

    <div class="footer"><a id="open-options">Settings</a></div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
