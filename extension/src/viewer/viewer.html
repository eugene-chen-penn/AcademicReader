<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AcademicReader Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #525659;
        color: #eee;
        font-family: system-ui, sans-serif;
      }

      /* Sticky wrapper around #status + #toolbar so they stick to the
         viewport top as one unit while scrolling through #pages below,
         WITHOUT any hardcoded pixel offset between them. (A previous
         version fixed #toolbar at a hardcoded `top: 32px` to clear
         #status's height -- but #status is hidden via `display: none` once
         the PDF finishes loading, so #toolbar stayed stuck 32px below the
         top forever after that, with nothing filling the gap above it.
         Stacking both inside one sticky flex column means the layout
         reflows itself correctly whenever #status's visibility changes, no
         magic numbers to keep in sync.) */
      #topbar {
        position: sticky;
        top: 0;
        z-index: 999;
        display: flex;
        flex-direction: column;
      }

      #status {
        padding: 8px 16px;
        font-size: 13px;
        background: #333;
        color: #ccc;
      }

      #status.hidden {
        display: none;
      }

      #status.error {
        background: #6b1f1f;
        color: #fff;
      }

      /* Shared mount point for Wave-2 toolbar controls (familiarity slider,
         region-select toggle, settings link, etc). Each track appends its
         own control here via getElementById at runtime rather than editing
         this file, so independent tracks never touch the same file. Flex
         row, controls added in any order should just line up. */
      #toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 6px 16px;
        background: #3a3d40;
        color: #ddd;
        font-size: 13px;
      }

      /* Shared mount point for the sidebar chat panel (Track E). Empty and
         inert until sidebar.ts populates + toggles it; not touched by any
         other track. */
      #sidebar-root {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 360px;
        background: #202225;
        color: #eee;
        box-shadow: -2px 0 8px rgba(0, 0, 0, 0.4);
        z-index: 1001;
        display: none;
      }

      #pages {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        /* No top padding needed: #topbar is a normal (sticky, not fixed)
           flow element directly above this one now, so it already reserves
           its own space -- see #topbar's comment above. */
        padding: 24px 0;
      }

      .ar-page {
        position: relative;
        background: #fff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
      }

      .ar-page canvas {
        display: block;
      }

      /* Minimal mirror of pdf.js's pdf_viewer.css .textLayer rules, needed
         because we render pages ourselves rather than using pdf.js's
         built-in PDFPageView/viewer UI. TextLayer.render() positions spans
         using `var(--scale-factor)`, which we set per-page in viewer.ts. */
      .textLayer {
        position: absolute;
        top: 0;
        left: 0;
        text-align: initial;
        overflow: clip;
        opacity: 1;
        line-height: 1;
        -webkit-text-size-adjust: none;
        text-size-adjust: none;
        forced-color-adjust: none;
        transform-origin: 0 0;
        z-index: 1;
      }

      .textLayer span,
      .textLayer br {
        color: transparent;
        position: absolute;
        white-space: pre;
        cursor: text;
        transform-origin: 0% 0%;
      }
    </style>
  </head>
  <body>
    <div id="topbar">
      <div id="status">Loading…</div>
      <div id="toolbar"></div>
    </div>
    <div id="pages"></div>
    <div id="sidebar-root"></div>
    <script type="module" src="viewer.js"></script>
  </body>
</html>
